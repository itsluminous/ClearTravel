name: Release

on:
  push:
    tags: ['v*']

jobs:
  check:
    name: Full CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ktlint, Android Lint, unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest

  release:
    name: Build signed release APK
    needs: check
    runs-on: ubuntu-latest
    # Creating a GitHub Release writes to the repository.
    permissions:
      contents: write
    env:
      # True only when all four signing secrets are configured; forks fall back
      # to a debug-keystore-signed release APK instead of failing.
      HAS_SIGNING_SECRETS: >-
        ${{
          secrets.SIGNING_KEYSTORE_BASE64 != '' &&
          secrets.SIGNING_KEYSTORE_PASSWORD != '' &&
          secrets.SIGNING_KEY_ALIAS != '' &&
          secrets.SIGNING_KEY_PASSWORD != ''
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bake the Maps/Google config so released APKs work out of the box. Secrets are
      # empty on forks — the app still builds and runs fully offline.
      - name: Write local.properties from secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          {
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # Without signing secrets an unsigned release APK would be produced, which
      # Android refuses to install. Fall back to a standard debug keystore so the
      # published artifact is at least installable (clearly named *-debugsigned).
      - name: Generate debug keystore fallback
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # versionName derives from the tag (v0.1.0 -> 0.1.0); versionCode from run number.
      - name: Assemble release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          else
            # Debug-keystore fallback: overrides the (empty) release secrets so the
            # Gradle signing config activates and the APK is installable.
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/debug.keystore"
            export SIGNING_KEYSTORE_PASSWORD=android
            export SIGNING_KEY_ALIAS=androiddebugkey
            export SIGNING_KEY_PASSWORD=android
          fi
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$GITHUB_RUN_NUMBER"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "==> $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Rename artifacts with version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          SUFFIX=""
          if [ "$HAS_SIGNING_SECRETS" != "true" ]; then
            SUFFIX="-debugsigned"
          fi
          # Split builds produce ClearTravel-<abi>.apk per ABI plus a universal
          # ClearTravel.apk; version every one of them.
          for apk in app/build/outputs/apk/release/ClearTravel*.apk; do
            base="$(basename "$apk" .apk)"
            rest="${base#ClearTravel}"
            mv "$apk" "app/build/outputs/apk/release/ClearTravel-$VERSION_NAME$rest$SUFFIX.apk"
          done
          ls -la app/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
